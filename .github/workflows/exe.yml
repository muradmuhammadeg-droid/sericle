name: Build Windows EXE and upload to 1.0 release

on:
  push:
    tags:
      - '1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Determine entry point
        id: entry
        run: |
          ENTRY=""
          if [ -f package.json ]; then
            ENTRY=$(node -e "const p=require('./package.json'); console.log(p.main || '');")
          fi
          if [ -z "$ENTRY" ] && [ -f server.js ]; then
            ENTRY=server.js
          fi
          if [ -z "$ENTRY" ]; then
            echo "No entry point found" >&2
            exit 1
          fi
          echo "entry=$ENTRY" >> $GITHUB_OUTPUT

      - name: Build exe with pkg
        run: |
          mkdir -p build
          npm install --no-audit --no-fund pkg
          npx pkg "${{ steps.entry.outputs.entry }}" --targets node18-win-x64 --output build/sericle.exe

      - name: Verify build
        run: |
          if [ ! -f build/sericle.exe ]; then echo "build/sericle.exe not found" >&2; exit 1; fi
          ls -lh build/sericle.exe

      - name: Create GitHub release for tag
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: Automated exe build for tag ${{ github.ref_name }}.
          draft: false
          prerelease: false

      - name: Upload exe to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/sericle.exe
          asset_name: sericle.exe
          asset_content_type: application/octet-stream

      - name: Cleanup
        if: always()
        run: npm uninstall pkg || true
